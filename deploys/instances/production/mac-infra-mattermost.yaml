kind: instance
extends: ../../bases/infra.yaml

instance:
  name: mac-infra-mattermost
  description: "MAC Mattermost team chat (hosted on tpp-stg-01)"

project: mac
environment: production
server: tpp-stg-01

source_overrides:
  owner: tgunawandev
  repo: kodemeio-mattermost
  compose_path: ./docker-compose.prod.yml
  branch: main

dns:
  zone: idtpp.com
  name: mac-mm

domain:
  host: mac-mm.idtpp.com
  port: 8065
  service: mattermost
  https: true
  cert: letsencrypt

env_file: ../../env/production/.env.mac-infra-mattermost

env_overrides:
  COMPOSE_PROJECT_NAME: mac-infra-mattermost
  MM_DOMAIN: mac-mm.idtpp.com
  TENANT: mac
  TZ: Asia/Jakarta

healthcheck:
  path: /api/v4/system/ping
  port: 8065
  expected_status: 200
  timeout: 120
  interval: 30
