kind: instance
extends: ../bases/nextjs.yaml

instance:
  name: pro-web
  description: "Provetics SaaS Platform - marketing site + portal"

project: pro

source_overrides:
  compose_path: compose/docker-compose.prod.provetics.yml

domain:
  host: provetics.com
  port: 3005
  service: provetics
  https: true
  cert: letsencrypt

healthcheck:
  path: /
  port: 3005
  expected_status: 200

env_file: ../env/pro-nextjs-web.env
