kind: instance
extends: ../../bases/infra.yaml

instance:
  name: tkz-infra-supabase
  description: "TeraKidz self-hosted Supabase (auth, DB, storage, realtime, functions)"

project: tkz

source_overrides:
  repo: terakidz-supabase
  compose_path: docker-compose.prod.yml

server: kod-prod-02

dns:
  zone: terakidz.com
  name: supa

domain:
  host: supa.terakidz.com
  port: 8000
  service: kong
  https: true
  cert: letsencrypt

healthcheck:
  path: /rest/v1/
  port: 8000
  expected_status: 200
  timeout: 120
  interval: 10

env_file: ../../env/production/.env.tkz-infra-supabase

backup:
  destination: kodemeio-s3-backups
  type: postgres
  schedule: "0 3 * * *"
  prefix_template: "tkz-supabase"
  keep_latest: 14
  service_name: db
  database: postgres
  database_user: postgres
