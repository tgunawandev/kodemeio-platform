kind: instance
extends: ../../bases/react-pwa.yaml
instance:
  name: mac-react-sfa
  description: MAC — SFA PWA
server: mac-prod-01
project: mac
source_overrides:
  compose_path: compose/docker-compose.sfa.yml
dns:
  zone: mandiriagro.com
  name: mac-sfa
domain:
  host: mac-sfa.mandiriagro.com
  port: 80
  service: sfa
  https: true
env_file: ../../env/production/.env.mac-react-sfa
env_overrides: {}
# All env vars come from env_file above — no overrides needed
# The .env file has correct OIDC credentials for production
