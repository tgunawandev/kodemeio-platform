kind: instance
extends: ../../bases/infra.yaml

instance:
  name: kod-infra-authentik
  description: "Authentik SSO/Identity Provider (embedded Postgres)"

project: kod
environment: production
server: kod-prod-03-data    # rehosted here after old kod-prod-02 (49.13.14.79) was removed

source_overrides:
  owner: tgunawandev
  repo: kodemeio-authentik
  branch: main
  compose_path: ./docker-compose.embedded.yml

domain:
  host: auth.kodeme.io
  port: 9000
  service: server
  https: true
  cert: letsencrypt

env_file: ../../env/production/.env.kod-infra-authentik
