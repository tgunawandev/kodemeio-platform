kind: instance
extends: ../../bases/infra.yaml

instance:
  name: tpp-infra-bentopdf
  description: "TPP BentoPDF — privacy-first client-side PDF toolkit (Authentik SSO)"

project: tpp
environment: production
# Colocated with tpp-infra-authentik so forward-auth can use the internal
# `authentik-server` alias on dokploy-network — avoids cross-host X-Forwarded-Host
# loss through Cloudflare/Traefik.
server: tpp-prod-01

source_overrides:
  type: github
  owner: tgunawandev
  repo: kodemeio-bentopdf
  branch: main
  compose_path: ./docker-compose.prod.yml

dns:
  zone: idtpp.com
  name: pdf

domain:
  host: pdf.idtpp.com
  port: 8080
  service: bentopdf
  https: true
  cert: letsencrypt

healthcheck:
  path: /
  port: 8080
  expected_status: 200
  timeout: 30
  interval: 10

env_file: ../../env/production/.env.tpp-infra-bentopdf

env_overrides:
  COMPOSE_PROJECT_NAME: tpp-infra-bentopdf
  TENANT: tpp
  AUTHENTIK_HOST: http://authentik-server:9000
  TZ: Asia/Jakarta

# SSO is enforced at the Traefik layer via a forward-auth middleware defined
# directly in docker-compose.prod.yml (calls ${AUTHENTIK_HOST}/outpost.goauthentik.io/auth/traefik).
# Authentik-side wiring: Proxy Provider 'bentopdf' (forward_single) is bound
# to the Embedded Outpost on auth.idtpp.com.
#
# BentoPDF is a client-side SPA: no database, no Redis, no persistent state,
# so no backup section is defined here (base `backup:` does not apply).
