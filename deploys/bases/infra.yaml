kind: base
type: infrastructure

server: kodeme-service
project: kodemeio-service

healthcheck:
  path: /
  port: 80
  expected_status: 200
  timeout: 60
  interval: 10

env_defaults:
  TZ: "Asia/Jakarta"

backup:
  destination: kodemeio-s3-backups
  type: postgres
  schedule: "0 3 * * *"
  prefix_template: "{instance_name}"
  keep_latest: 14
