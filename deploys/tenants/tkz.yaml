tenant:
  code: tkz
  name: "TeraKidz"
  short_name: "TKZ"
  domain: terakidz.com

environments:
  production:
    server: kod-prod-02
    dns_prefix: ""
    db_prefix: ""
    auto_deploy: false

services:
  infra-postgres:
    description: "TeraKidz dedicated PostgreSQL 16 + PgBouncer"
    compose_repo: kodemeio-postgres
    compose_file: docker-compose.prod.yml
    port: 5432

  react-learn:
    description: "TeraKidz Learn — ABA edugames SPA (React 19 + Vite + Capacitor)"
    compose_repo: terakidz-react
    compose_file: compose/docker-compose.dev.learn.yml
    domain: app.terakidz.com
    port: 80

  nextjs-web:
    description: "TeraKidz marketing site (Next.js 15)"
    compose_repo: terakidz-react
    compose_file: compose/docker-compose.web.yml
    domain: terakidz.com
    port: 80

  hono-svc:
    description: "TeraKidz Hono API service (auth, curriculum, journal, insights, payments)"
    compose_repo: terakidz-react
    compose_file: compose/docker-compose.svc.yml
    domain: api-svc.terakidz.com
    port: 3100
