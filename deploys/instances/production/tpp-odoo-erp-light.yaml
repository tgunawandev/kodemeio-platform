kind: instance
extends: ../../bases/odoo.yaml
instance:
  name: tpp-odoo-erp-light
  description: Pakerti — ERP Light (minimal modules, comparison testing)
project: tpp
environment: production
server: tpp-prod-03
dns:
  zone: idtpp.com
  name: tpp-odoo-erp-light
domain:
  host: tpp-odoo-erp-light.idtpp.com
  port: 8069
  service: odoo-web
  https: true
  cert: letsencrypt
database:
  name: tpp_odoo_erp_light
  user: odoo
env_file: ../../env/production/.env.tpp-odoo-erp-light
env_overrides:
  COMPOSE_PROJECT_NAME: tpp-odoo-erp-light
  TENANT: tpp
  PGDATABASE: tpp_odoo_erp_light
  PGUSER: odoo
  ODOO_DB_FILTER: ^tpp_odoo_erp_light$
  DOMAIN: tpp-odoo-erp-light.idtpp.com
  ODOO_WORKERS: '4'
post_deploy:
  odoo_profile: profile-erp-light
  odoo_install_bundle: ''
  recipe: erp-light
