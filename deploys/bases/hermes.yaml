# Naming convention for instances:
#   File:     {tenant}-infra-hermes.yaml
#   Instance: {tenant}-infra-hermes
#   Env file: .env.{tenant}-infra-hermes
#
# Mirrors the shape of bases/infra.yaml. Source repo holds the compose file,
# Dokploy builds the image via BuildKit remote git context per-deploy.

kind: base
type: infrastructure

source:
  type: github
  owner: tgunawandev
  repo: kodemeio-hermes
  branch: main
  compose_path: docker-compose.prod.yml

server: kodeme-service
project: kod

# Must match docker-compose.prod.yml's healthcheck. /opt/data/mcp.yaml is the
# LEGACY render-script output (removed) — hermes never read it, so checking it
# marked every container unhealthy. config.yaml is the real state file.
healthcheck:
  test: ["CMD-SHELL", "pgrep -f 'gateway run' >/dev/null && test -f /opt/data/config.yaml"]
  port: 0
  timeout: 10
  interval: 60
  start_period: 180

env_defaults:
  TZ: "Asia/Jakarta"
  HERMES_LOG_LEVEL: "info"
  HERMES_UID: "10000"
  HERMES_GID: "10000"
  HERMES_UPSTREAM_REF: "v2026.5.16"

backup:
  destination: kodemeio-s3-backups
  type: volume
  source: hermes-state
  schedule: "0 4 * * *"
  prefix_template: "{instance_name}"
  keep_latest: 14
