tenant:
  code: tkz
  name: "TeraKidz"
  short_name: "TKZ"
  domain: terakidz.com

environments:
  production:
    server: kod-prod-02
    dns_prefix: ""
    db_prefix: ""
    auto_deploy: false

services:
  supabase:
    description: "Self-hosted Supabase BaaS (auth, DB, storage, realtime, functions)"
    compose_repo: terakidz-supabase
    compose_file: docker-compose.prod.yml
    domain: supa.terakidz.com
    port: 8000

  react-learn:
    description: "TeraKidz Learn — ABA edugames SPA (React 19 + Vite + Capacitor)"
    compose_repo: terakidz-react
    compose_file: compose/docker-compose.dev.learn.yml
    domain: learn.terakidz.com
    port: 80

  nextjs-web:
    description: "TeraKidz marketing site (Next.js 15)"
    compose_repo: terakidz-react
    compose_file: compose/docker-compose.web.yml
    domain: terakidz.com
    port: 80

  react-talk:
    description: "TeraKidz Talk — daily schedule & behavior logger (React 19 + Vite)"
    compose_repo: terakidz-react
    compose_file: compose/docker-compose.talk.yml
    domain: talk.terakidz.com
    port: 80

  hono-svc:
    description: "TeraKidz Hono API service (payments, sync, notifications)"
    compose_repo: terakidz-react
    compose_file: compose/docker-compose.svc.yml
    domain: api-svc.terakidz.com
    port: 3100
