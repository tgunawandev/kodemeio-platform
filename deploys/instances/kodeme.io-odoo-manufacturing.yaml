kind: instance
extends: ../bases/odoo.yaml

instance:
  name: kodemeio-odoo-mfg
  description: "Manufacturing / FMCG Principal — MRP, SFA, WMS, TPM, BI"

dns:
  zone: kodeme.io
  name: odoo-mfg
  content: 49.13.14.79             # kodeme-service (16GB RAM)

domain:
  host: odoo-mfg.kodeme.io
  port: 8069
  service: odoo
  https: true

database:
  name: odoo_manufacturing
  user: odoo

env_file: ../env/odoo/.env.prod.manufacturing

env_overrides:
  PGDATABASE: odoo_manufacturing
  PGUSER: odoo
  ODOO_DB_FILTER: "^odoo_manufacturing$"
  DOMAIN: odoo-mfg.kodeme.io

post_deploy:
  odoo_profile: profile-manufacturing
