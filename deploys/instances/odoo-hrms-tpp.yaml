kind: instance
extends: ../bases/odoo.yaml

instance:
  name: odoo-hrms-tpp
  description: "TPP — HRMS (employees, attendance, payroll, leaves, expenses)"

dns:
  zone: kodeme.io
  name: odoo-hrms-tpp
  content: 49.13.14.79

domain:
  host: odoo-hrms-tpp.kodeme.io
  port: 8069
  service: odoo-web
  https: true

database:
  name: odoo_hrms_tpp
  user: odoo

env_file: ../env/odoo/.env.prod.hrms-tpp

env_overrides:
