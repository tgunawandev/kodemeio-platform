[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kctl-dbgate"
version = "0.2.0"
description = "Kodemeio DBGate CLI - manage DBGate web-based database management UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Kodemeio", email = "dev@kodeme.io" }]
keywords = ["dbgate", "database", "admin", "cli", "kodemeio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "kctl-lib>=0.4.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
kctl-dbgate = "kctl_dbgate.cli:_run"

[tool.uv.sources]
kctl-lib = { workspace = true }

[project.entry-points."kctl_dbgate.plugins"]

[tool.hatch.build.targets.wheel]
packages = ["src/kctl_dbgate"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
