kind: instance
extends: ../bases/react-pwa.yaml

instance:
  name: kodemeio-react-sfa-mac
  description: "MAC Customer — SFA PWA"

source_overrides:
  compose_path: ./docker-compose.sfa.yml

dns:
  zone: kodeme.io
  name: sfa-mac
  content: 49.13.14.79

domain:
  host: sfa-mac.kodeme.io
  port: 80
  service: sfa
  https: true

env_overrides:
  VITE_SFA_APP_NAME: "MAC SFA"
  VITE_SFA_API_BASE_URL: "https://odoo-mac.kodeme.io"
  VITE_SFA_OIDC_CLIENT_ID: "mac-sfa"
  VITE_SFA_OIDC_REDIRECT_URI: "https://sfa-mac.kodeme.io/callback"
