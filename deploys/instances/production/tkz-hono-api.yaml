kind: instance
extends: ../../bases/infra.yaml

instance:
  name: tkz-hono-api
  description: "TeraKidz Hono API (curriculum, journal, insights, auth, payments)"

source_overrides:
  repo: terakidz-react
  branch: main
  compose_path: compose/docker-compose.api.yml

project: tkz
environment: production
server: kod-prod-02

dns:
  zone: terakidz.com
  name: api

domain:
  host: api.terakidz.com
  port: 3100
  service: api
  https: true
  cert: letsencrypt

healthcheck:
  path: /health
  port: 3100
  expected_status: 200
  timeout: 60
  interval: 10

env_file: ../../env/production/.env.tkz-hono-api

env_overrides:
  NODE_ENV: production
  PORT: "3100"
  DATABASE_URL: "postgresql://terakidz:${TKZ_PG_PASSWORD}@tkz-postgres:6432/terakidz"
  BETTER_AUTH_SECRET: "${TKZ_AUTH_SECRET}"
  BETTER_AUTH_URL: "https://api.terakidz.com"
