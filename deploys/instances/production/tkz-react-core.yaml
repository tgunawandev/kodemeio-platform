kind: instance
extends: ../../bases/react-pwa.yaml

instance:
  name: tkz-react-core
  description: "Terakidz Core — Daily routine tracker for ASD children"

source_overrides:
  repo: terakidz-react
  branch: master
  compose_path: compose/docker-compose.core.yml

project: tkz
environment: production
server: kod-prod-02

dns:
  zone: terakidz.com
  name: core

domain:
  host: core.terakidz.com
  port: 80
  service: core
  https: true
  cert: letsencrypt

healthcheck:
  path: /
  port: 80
  expected_status: 200
  timeout: 60
  interval: 5

env_file: ../../env/production/.env.tkz-react-core

env_overrides:
  VITE_APP_NAME: "Terakidz Core"
  VITE_SUPABASE_URL: "https://supa.terakidz.com"
  VITE_AUTH_MODE: "supabase"
