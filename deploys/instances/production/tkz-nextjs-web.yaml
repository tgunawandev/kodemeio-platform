kind: instance
extends: ../../bases/nextjs.yaml

instance:
  name: tkz-nextjs-web
  description: "Terakidz marketing site (Next.js 15)"

source_overrides:
  repo: terakidz-react
  branch: main
  compose_path: compose/docker-compose.web.yml

project: tkz

dns:
  zone: terakidz.com
  name: "@"
  # content auto-resolved from server IP via Gate 1 validation

domain:
  host: terakidz.com
  port: 3000
  service: terakidz-web
  https: true
  cert: letsencrypt

env_file: ../../env/production/.env.tkz-nextjs-web
