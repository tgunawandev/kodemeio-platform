tenant:
  code: tpp
  name: "Pakerti"
  short_name: "Pakerti"
  domain: idtpp.com

environments:
  production:
    server: tpp-prod-03
    dns_prefix: ""
    db_prefix: ""
    auto_deploy: false
  staging:
    server: tpp-stg-01
    dns_suffix: "-stg"
    db_suffix: "_stg"
    auto_deploy: true

odoo:
  - recipe: import
    short: erp
    description: "ERP — Import + Trading + Distribution (multi-company, 43 CVs)"
    workers: 4
    apps: [bia, wms]
  - recipe: hrms
    short: hrms
    description: "HRMS (employees, attendance, payroll, leaves, expenses)"
    workers: 2
    apps: [hrm]

  # IT service desk. `host:` claims a bare subdomain — the instance is still
  # tpp-odoo-helpdesk (DB tpp_odoo_helpdesk, env .env.tpp-odoo-helpdesk), only
  # the public name moves.
  #
  # No per-entry `server:` — gen_odoo does not read one, so it would be a
  # silently ignored key. This lands on the tenant's production server,
  # tpp-prod-03, which is where tpp-odoo-erp and tpp-odoo-hrms already run.
  # That is deliberate: tpp-prod-03 has PROVEN private-network reach to
  # PGHOST 10.0.0.3, whereas the emptier tpp-prod-05 has never hosted an Odoo
  # instance and its reach is unverified. A 2-worker, 99-module desk is small
  # enough that proven beats idle.
  - recipe: helpdesk
    short: helpdesk
    host: helpdesk.idtpp.com
    description: "IT Service Desk (OCA helpdesk, no ERP)"
    workers: 2
    apps: []

web:
  corporate:
    compose_brand: idtpp
  careers: true

accurate_sync:
  enabled: true
  odoo_ref: erp            # maps to the odoo[] entry with short: erp
  tenants: [tpp]           # ACCURATE_TENANTS comma-joined at render
  # server: (defaults to the tpp-odoo-erp server, tpp-prod-03)

schedulers:
  - name: maintenance
    schedule_file: tpp-maintenance.ini
    server: tpp-prod-01
  - name: reports
    schedule_file: tpp-reports.ini
    server: tpp-prod-01

services:
  notify:
    # Pin notify to tpp-prod-01 alongside the rest of the tpp-infra-* stack
    # (postgres, redis, authentik, mailcow, mdm, rmm, outline, zulip, jitsi).
    # Default for tpp tenant apps is tpp-prod-03 (ERP host); this override
    # colocates the notify dispatcher with the postgres + redis it depends on.
    server: tpp-prod-01
  mattermost:
    # HISTORICAL RESERVATION — tpp-prod-04 was originally held for Mattermost
    # + RTC on the grounds that call quality needs isolated CPU + UDP ports
    # (8443/8445). RTC never landed here, and neither did Mattermost:
    # tpp-infra-mattermost runs on tpp-prod-01, tpp-infra-mattermost-sg and
    # -sg-prod on tpp-prod-06, and mm.idtpp.com resolves to 5.223.69.142
    # (tpp-prod-06). This entry is the unrealised intent, not the live host.
    #
    # As of 2026-09-01 tpp-prod-04 also hosts FRIDAY (tpp-infra-hermes,
    # superuser, 4 CPU / 6G) alongside kctl, xyops, xyops-backup and
    # dokploy-traefik, at load ~0.02. Colocation was a deliberate decision:
    # tpp-prod-01 had 5G free across 66 containers, tpp-prod-04 had 14G.
    #
    # WARNING: if Mattermost or RTC is ever actually moved onto this host,
    # the CPU-isolation requirement comes back and FRIDAY must be relocated
    # first — a superuser agent runs Node builds and tests and will contend
    # with RTC for CPU.
    server: tpp-prod-04

# Hermes — FRIDAY (odoo-developer AI). Superuser edition on Codex, on the
# idle tpp-prod-04. Mattermost inbound only (Telegram runs on kod-infra-hermes).
# Dashboard is loopback-only (SSH tunnel); no domain, no Traefik.
# Spec: kodemeio-hermes/docs/superpowers/specs/2026-09-01-odoo-developer-ai-design.md
hermes:
  enabled: true
  edition: superuser
  server: tpp-prod-04
  # Pinned for TPP ONLY. v2026.5.16 carries a Codex stream bug ("NoneType object
  # is not iterable") that breaks the exact backend FRIDAY runs on. kod and mac
  # stay on the fleet default (see HERMES_DEFAULT_UPSTREAM_REF in generate.py) —
  # this bump is not validated for them.
  upstream_ref: v2026.8.31
  dashboard:
    enabled: true
  inbound:
    telegram:
      enabled: false
    mattermost:
      enabled: true
      url: https://mm.idtpp.com
      reply_mode: thread
      require_mention: true
      allowed_channels:
        - nxe8gt7xyfbp9rxqdqso5m17dr
  memory:
    honcho:
      enabled: false

# Filestore (attachment) backups — production only.
#
# volume MUST be the exact docker volume name on the host: Dokploy names
# compose volumes {appName}_{volume} and ignores COMPOSE_PROJECT_NAME, so
# tpp-odoo-erp_odoo-filestore (6.2 MB) is a DECOY sitting beside the live one.
# Measured 2026-08-08: 40,927 files / 21 GB on tpp-prod-03.
#
# pinned_cron runs 15 min after the 02:35 UTC pg_dump, so there is always a
# filestore snapshot NEWER than the database dump it will be restored with.
filestore_backups:
  - short: erp
    volume: compose-quantify-cross-platform-panel-898kcx_odoo-filestore
    database: tpp_odoo_erp
    min_files: 36000
    pinned_cron: "50 2 * * *"
    bucket: hz-tpp-odoo-filestore
    server: tpp-prod-03

  # Staging canary — proves the whole cycle (seed, guard, restore) on a real
  # Odoo filestore before production is touched. Own restic repo, so a staging
  # retention run can never prune production history.
  #
  # server is pinned to tpp-prod-07 because that is where tpp-odoo-erp-stg
  # ACTUALLY runs; the staging manifests claim tpp-stg-01, which is not a
  # server Dokploy knows about.
  # Measured 2026-08-08: 548 files / 160 MB.
  - short: erp
    environment: staging
    volume: compose-compress-virtual-program-t5pjl6_odoo-filestore
    database: tpp_odoo_erp_stg
    min_files: 490
    pinned_cron: ""
    bucket: hz-tpp-odoo-filestore
    server: tpp-prod-07
