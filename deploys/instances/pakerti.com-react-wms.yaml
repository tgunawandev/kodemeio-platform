kind: instance
extends: ../bases/react-pwa.yaml

instance:
  name: pakerti-react-wms
  description: "Pakerti — WMS PWA"

source_overrides:
  compose_path: compose/docker-compose.wms.yml

project: pakerti.com

dns:
  zone: pakerti.com
  name: wms

domain:
  host: wms.pakerti.com
  port: 80
  service: wms
  https: true

env_file: ../env/pakerti.com-react-wms.env

env_overrides:
  VITE_WMS_APP_NAME: "Pakerti WMS"
  VITE_WMS_API_BASE_URL: "https://odoo-trading-tpp.kodeme.io/wms/api"
  VITE_AUTH_MODE: "native"
  VITE_WMS_OIDC_CLIENT_ID: ""
  VITE_WMS_OIDC_REDIRECT_URI: ""
