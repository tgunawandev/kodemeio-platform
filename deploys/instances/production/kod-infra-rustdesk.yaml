kind: instance
extends: ../../bases/infra.yaml

instance:
  name: kod-infra-rustdesk
  description: "RustDesk remote desktop server"

project: kod

source_overrides:
  repo: kodemeio-rustdesk

domain:
  host: rustdesk.kodeme.io
  port: 21114
  service: rustdesk-server
  https: true
  cert: letsencrypt

env_file: ../../env/production/.env.kod-infra-rustdesk
