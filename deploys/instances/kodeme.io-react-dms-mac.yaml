kind: instance
extends: ../bases/react-pwa.yaml

instance:
  name: kodemeio-react-dms-mac
  description: "MAC Customer — DMS PWA"

source_overrides:
  compose_path: ./docker-compose.dms.yml

dns:
  zone: kodeme.io
  name: dms-mac
  content: 49.13.14.79

domain:
  host: dms-mac.kodeme.io
  port: 80
  service: dms
  https: true

env_overrides:
  VITE_DMS_APP_NAME: "MAC DMS"
  VITE_DMS_API_BASE_URL: "https://odoo-mac.kodeme.io"
  VITE_DMS_OIDC_CLIENT_ID: "mac-dms"
  VITE_DMS_OIDC_REDIRECT_URI: "https://dms-mac.kodeme.io/callback"
