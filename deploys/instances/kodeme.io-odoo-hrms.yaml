kind: instance
extends: ../bases/odoo.yaml

instance:
  name: kodemeio-odoo-hrms
  description: "HRMS — Standalone HR, attendance, leave, payroll"

dns:
  zone: kodeme.io
  name: odoo-hrms
  content: 49.13.14.79             # kodeme-service (16GB RAM)

domain:
  host: odoo-hrms.kodeme.io
  port: 8069
  service: odoo
  https: true

database:
  name: odoo_hrms
  user: odoo

env_file: ../env/odoo/.env.prod.hrms

env_overrides:
  PGDATABASE: odoo_hrms
  PGUSER: odoo
  ODOO_DB_FILTER: "^odoo_hrms$"
  DOMAIN: odoo-hrms.kodeme.io
  ODOO_WORKERS: "2"
  ODOO_MAX_CRON_THREADS: "1"

post_deploy:
  odoo_profile: profile-hrms
