kind: instance
extends: ../bases/react-pwa.yaml

instance:
  name: kodemeio-react-lfa-mac
  description: "MAC Customer — LFA PWA"

project: mandiriagro.com

source_overrides:
  compose_path: ./docker-compose.lfa.yml

dns:
  zone: kodeme.io
  name: lfa-mac
  content: 49.13.14.79

domain:
  host: lfa-mac.kodeme.io
  port: 80
  service: lfa
  https: true

env_overrides:
  VITE_LFA_APP_NAME: "MAC LFA"
  VITE_LFA_API_BASE_URL: "https://odoo-mac.kodeme.io"
  VITE_LFA_OIDC_CLIENT_ID: "mac-lfa"
  VITE_LFA_OIDC_REDIRECT_URI: "https://lfa-mac.kodeme.io/callback"
