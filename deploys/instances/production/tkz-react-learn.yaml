kind: instance
extends: ../../bases/react-pwa.yaml

instance:
  name: tkz-react-learn
  description: "TeraKidz Learn — ABA edugames for children with autism"

source_overrides:
  repo: terakidz-react
  branch: master
  compose_path: compose/docker-compose.dev.learn.yml

project: tkz
environment: production
server: kod-prod-02

dns:
  zone: terakidz.com
  name: learn

domain:
  host: learn.terakidz.com
  port: 80
  service: learn
  https: true
  cert: letsencrypt

healthcheck:
  path: /
  port: 80
  expected_status: 200
  timeout: 60
  interval: 5

env_file: ../../env/production/.env.tkz-react-learn

env_overrides:
  VITE_APP_NAME: "Terakidz Learn"
  VITE_SUPABASE_URL: "https://supa.terakidz.com"
  VITE_AUTH_MODE: "supabase"
