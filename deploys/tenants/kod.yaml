tenant:
  code: kod
  name: "Kodemeio"
  short_name: "KOD"
  domain: kodeme.io

environments:
  production:
    server: kod-prod-02
    dns_prefix: ""
    db_prefix: ""
  staging:
    server: kod-prod-02
    dns_suffix: "-stg"
    db_suffix: "_stg"
    auto_deploy: true

odoo:
  - recipe: full
    short: full
    description: "Full Odoo (all modules, all PWA apps)"
    workers: 6
    apps: [bia, dms, eam, hrm, lfa, mrp, saas, sfa, shop, tms, tms-parent, tpm, wms]

# Hermes — agent on kod-prod-04-claude. Telegram inbound. Honcho enabled
# after Phase B of the 2026-05-23 Honcho rollout (currently false because
# the deploy waits on the operator's OpenRouter key).
hermes:
  # Pin the ref kod is ACTUALLY running. It was bumped by hand to v2026.5.29 on
  # 2026-05-29 to fix the Codex event-stream crash ('NoneType object is not
  # iterable') and had never been recorded here. Now that gen_hermes emits
  # HERMES_UPSTREAM_REF into env_overrides — which beats hand-set Dokploy env —
  # omitting this would roll kod back to the default v2026.5.16 and reintroduce
  # that bug on the next `deploy apply`.
  upstream_ref: v2026.5.29
  enabled: true
  edition: superuser
  server: kod-prod-04-claude
  inbound:
    telegram:
      enabled: true
    mattermost:
      enabled: false
  memory:
    honcho:
      enabled: false
