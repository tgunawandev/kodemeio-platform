kind: instance
extends: ../../bases/infra.yaml

instance:
  name: kod-infra-plane
  description: "Plane project management with native OIDC SSO (Authentik)"

project: kod
server: kod-prod-02

source_overrides:
  repo: kodemeio-plane
  compose_path: ./docker-compose.prod.yml

domain:
  host: plane.kodeme.io
  port: 80
  service: proxy
  https: true
  cert: letsencrypt

env_file: ../../env/production/.env.kod-infra-plane
