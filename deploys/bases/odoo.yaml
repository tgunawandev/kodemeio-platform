# Naming convention for instances:
#   File:     {tenant}-odoo-{profile}.yaml
#   Instance: {tenant}-odoo-{profile}
#   Database: odoo_{profile}_{tenant}
#   Domain:   {tenant}-odoo-{profile}.{domain}
#
# Examples:
#   kod-odoo-full         → odoo_full_kod         → odoo.kodeme.io
#   mac-odoo-dist         → odoo_dist_mac         → mac-odoo-dist.mandiriagro.com
#   tpp-odoo-erp          → tpp_odoo_erp          → tpp-odoo-erp.idtpp.com

kind: base
type: odoo

source:
  type: github
  owner: tgunawandev
  repo: kodemeio-odoo
  branch: "18.0"
  compose_path: ./compose/odoo.prod.yml

server: kodeme-service
project: kod

healthcheck:
  path: /web/health
  port: 8069
  expected_status: 200
  timeout: 900
  interval: 15

# Resource recommendations by profile:
#   foundation/hrms:                    ODOO_WORKERS=2, 1 CPU, 2G memory
#   trading:                            ODOO_WORKERS=4, 2 CPU, 4G memory
#   distribution/manufacturing/retail:  ODOO_WORKERS=4, 2 CPU, 4G memory
#   *-hrms (combined):                  ODOO_WORKERS=6, 3 CPU, 6G memory
#   full:                               ODOO_WORKERS=6, 4 CPU, 8G memory
# Override via env_overrides in instance manifests or env_file.

env_defaults:
  RUNNING_ENV: production
  ODOO_WORKERS: "4"
  ODOO_MAX_CRON_THREADS: "2"
  ODOO_LIST_DB: "False"
  WITHOUT_DEMO: "True"
  # PGHOST is intentionally NOT defaulted here. The deployer's env merge
  # order is env_file < env_defaults < env_overrides, so a default at
  # this layer would silently clobber any PGHOST set in the per-instance
  # env file. Each tenant must put PGHOST in its own env_overrides.
  PGPORT: "5432"
  ODOO_TAG: "latest"
  # Full server-wide module list — ALL Odoo instances need bus,
  # bus_alt_connection, session_db, and dbfilter_from_header to be
  # functional. Defaulting to just 'base,web' previously caused
  # silent breakage: websockets disconnecting, sessions wiped on
  # every container recreate, and the X-Odoo-dbfilter header being
  # ignored. Each instance can still override in env_overrides.
  ODOO_SERVER_WIDE_MODULES: "base,web,bus,bus_alt_connection,session_db,dbfilter_from_header"
  ODOO_MANDATORY_BUNDLE: "oca-mandatory"
  ODOO_MANDATORY_GROUPS: "core"
  IR_ATTACHMENT_LOCATION: "file"
  TZ: "Asia/Jakarta"

backup:
  destination: kodemeio-s3-backups
  type: postgres
  schedule: "0 2 * * *"
  prefix_template: "odoo-{instance_name}"
  keep_latest: 30

# NOTE: `service` MUST name a real compose service. compose/odoo.prod.yml
# defines odoo-web / odoo-cron / odoo-gevent -- there has never been a service
# called `odoo`. Dokploy resolves the target container as
# {compose.appName}-{service}-1; an unmatched name yields an EMPTY string, so
# it runs `docker exec  bash -c ...` and Docker reads `bash` as the container
# name. That typo made these schedules fail 100% of the time from 2026-04-09
# to 2026-08-31 with no alert, because Dokploy has no failure notification for
# scheduled jobs. odoo-cron is chosen over odoo-web so maintenance never
# competes with a user-facing worker.
schedules:
  - name: "{instance_name}-vacuum"
    cron: "0 4 * * 0"
    command: "vacuumdb -U {db_user} -d {db_name} --analyze"
    service: odoo-cron
    shell: bash
    timezone: Asia/Jakarta
  # Invoked as a script, NOT as inline SQL, and that is not a style choice.
  #
  # Dokploy passes a schedule's `command` to a shell WITHOUT escaping shell
  # metacharacters. Verified by single-character bisection against live
  # Dokploy on 2026-08-31:
  #
  #     psql ... -tAc "SELECT 1 WHERE 1 = 1"   -> status: done
  #     psql ... -tAc "SELECT 1 WHERE 1 < 2"   -> status: error
  #     psql ... -tAc "SELECT count(*) ..."    -> status: error
  #     psql ... -c "... INTERVAL '7 days'"    -> status: error
  #
  # A command containing < > ( ) or ' dies before Dokploy logs its "Running
  # command:" line, leaving a 22-byte log reading only "Initializing
  # schedule" -- and no alert, because Dokploy has no failure notification for
  # scheduled jobs. This cleanup needs a comparison (<), an interval (quotes)
  # and a function (parens), so it CANNOT be expressed inline.
  #
  # The script lives in kodemeio-odoo at scripts/session-cleanup.sh and is
  # baked into the image at /opt/odoo/scripts/. It also fixes the table name:
  # session_db creates http_sessions; ir_sessions does not exist in Odoo 18.
  #
  # REQUIRES an Odoo image built at or after kodemeio-odoo c7581b9.
  - name: "{instance_name}-session-cleanup"
    cron: "0 3 * * *"
    command: "bash /opt/odoo/scripts/session-cleanup.sh"
    service: odoo-cron
    shell: bash
    timezone: Asia/Jakarta

post_deploy: {}
