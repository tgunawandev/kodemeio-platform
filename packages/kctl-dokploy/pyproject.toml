[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kctl-dokploy"
version = "0.4.1"
description = "Kodemeio Dokploy CLI — manage Dokploy deployment platform"
requires-python = ">=3.12"
dependencies = [
    "kctl-lib>=0.4.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
kctl-dokploy = "kctl_dokploy.cli:_run"

[project.entry-points."kctl_dokploy.plugins"]

[tool.uv.sources]
kctl-lib = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/kctl_dokploy"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
strict = true
