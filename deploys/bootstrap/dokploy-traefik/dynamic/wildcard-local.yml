# Traefik file-provider fragment.
# Registers the *.local.kodeme.io wildcard as the DEFAULT certificate —
# any route without an explicit cert resolver uses it.
# Paths match host AND container — the dokploy-traefik compose bind-mounts
# /etc/dokploy/traefik:/etc/dokploy/traefik:ro so references resolve identically.
tls:
  certificates:
    - certFile: /etc/dokploy/traefik/dynamic/certs/local.kodeme.io/fullchain.pem
      keyFile:  /etc/dokploy/traefik/dynamic/certs/local.kodeme.io/privkey.pem
      stores:   [default]
  stores:
    default:
      defaultCertificate:
        certFile: /etc/dokploy/traefik/dynamic/certs/local.kodeme.io/fullchain.pem
        keyFile:  /etc/dokploy/traefik/dynamic/certs/local.kodeme.io/privkey.pem
