kind: instance
extends: ../bases/odoo.yaml

instance:
  name: odoo-trad-tpp
  description: "TPP — Trading (import/export, multi-currency, landed costs)"

project: pakerti.com

dns:
  zone: pakerti.com
  name: odoo-trad-tpp

domain:
  host: odoo-trad-tpp.pakerti.com
  port: 8069
  service: odoo-web
  https: true

database:
  name: odoo_trad_tpp
  user: odoo

env_file: ../env/pakerti.com-odoo-trad.env

env_overrides:
  COMPOSE_PROJECT_NAME: odoo-trad-tpp
  TENANT: tpp
  PGDATABASE: odoo_trad_tpp
  PGUSER: odoo
  ODOO_DB_FILTER: "^odoo_trad_tpp$"
  DOMAIN: odoo-trad-tpp.pakerti.com

post_deploy:
  odoo_profile: profile-trading
