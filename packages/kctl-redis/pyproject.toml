[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kctl-redis"
version = "0.1.0"
description = "Kodemeio Redis CLI — manage Redis servers via SSH tunnel"
requires-python = ">=3.12"
dependencies = [
    "kctl-lib>=0.4.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "redis[hiredis]>=5.0.0",
    "sshtunnel>=0.4.0",
    "paramiko>=3.4.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.0",
    "types-redis>=4.6.0",
]

[project.scripts]
kctl-redis = "kctl_redis.cli:_run"

[tool.uv.sources]
kctl-lib = { workspace = true }

[project.entry-points."kctl_redis.plugins"]

[tool.hatch.build.targets.wheel]
packages = ["src/kctl_redis"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
strict = true
