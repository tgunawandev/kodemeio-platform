[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kctl-api"
version = "0.1.0"
description = "Kodemeio API CLI - manage your FastAPI platform"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Kodemeio", email = "dev@kodeme.io" }]
keywords = ["fastapi", "api", "cli", "kodemeio", "rest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "kctl-lib>=0.4.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
db = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
]
redis = [
    "redis>=5.0.0",
]
all = [
    "kctl-api[db,redis]",
]
dev = [
    "pytest>=8.3.0",
    "pytest-httpx>=0.35.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
kctl-api = "kctl_api.cli:_run"

[tool.uv.sources]
kctl-lib = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/kctl_api"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["kctl_api"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a running API instance",
]

[tool.coverage.run]
source = ["src/kctl_api"]
omit = ["*/commands/aliases.py"]


[tool.coverage.report]
show_missing = true
skip_empty = true
