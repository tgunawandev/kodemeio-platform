#cloud-config
# =============================================================================
# Base cloud-init for all Kodemeio servers
# =============================================================================

timezone: ${timezone}

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - htop
  - iotop
  - tmux
  - jq
  - unzip
  - fail2ban
  - ufw
  - net-tools
  - ca-certificates
  - gnupg
  - lsb-release
  - apt-transport-https

# Create swap
swap:
  filename: /swapfile
  size: ${swap_size_mb}M
  maxsize: ${swap_size_mb}M

write_files:
  # SSH hardening
  - path: /etc/ssh/sshd_config.d/99-kodemeio.conf
    content: |
      Port ${ssh_port}
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2

  # Sysctl tuning
  - path: /etc/sysctl.d/99-kodemeio.conf
    content: |
      # Network performance
      net.core.somaxconn = 65535
      net.core.netdev_max_backlog = 65536
      net.ipv4.tcp_max_syn_backlog = 65536
      net.ipv4.tcp_tw_reuse = 1
      net.ipv4.ip_local_port_range = 1024 65535

      # Memory
      vm.swappiness = 10
      vm.overcommit_memory = 1

      # File descriptors
      fs.file-max = 2097152
      fs.inotify.max_user_watches = 524288

  # Limits
  - path: /etc/security/limits.d/99-kodemeio.conf
    content: |
      * soft nofile 65536
      * hard nofile 65536
      * soft nproc 65536
      * hard nproc 65536

runcmd:
  # Apply sysctl
  - sysctl --system

  # Configure UFW
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ${ssh_port}/tcp comment 'SSH'
  - ufw --force enable

  # Configure fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Set timezone
  - timedatectl set-timezone ${timezone}

  # Enable unattended upgrades for security patches
  - apt-get install -y unattended-upgrades
  - dpkg-reconfigure -plow unattended-upgrades

final_message: "Kodemeio base setup complete after $UPTIME seconds"
