kind: instance
extends: ../bases/odoo.yaml

instance:
  name: odoo-distribution-kodemeio
  description: "Kodemeio Production ERP — Distribution (SFA, LFA, WMS, DMS, Shop, BI)"

dns:
  zone: kodeme.io
  name: odoo
  content: 49.13.116.191           # kodeme-infra (Dokploy server)

domain:
  host: odoo.kodeme.io
  port: 8069
  service: odoo
  https: true

database:
  name: kodemeio_prod
  user: odoo

env_file: ../env/odoo/.env.prod.distribution

env_overrides:
  PGDATABASE: kodemeio_prod
  PGUSER: odoo
  ODOO_DB_FILTER: "^kodemeio_prod$"
  DOMAIN: odoo.kodeme.io

post_deploy:
  odoo_profile: profile-distribution
