# ──────────────────────────────────────────────────────────────────────
# Logo Generation Defaults
# ──────────────────────────────────────────────────────────────────────
defaults:
  sizes: [32, 64, 128, 256, 512]
  formats: [png, svg]
  styles: [icon-badge, monogram, full]
  corner_radius_ratio: 0.22    # Rounded corners as ratio of size
  icon_padding_ratio: 0.25     # Icon padding inside badge
  font_family: "Inter"         # Falls back to system sans-serif
  signature: "kodeme.io"
