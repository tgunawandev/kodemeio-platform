name: Publish kctl-common to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras
        working-directory: packages/kctl-common

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        working-directory: packages/kctl-common

      - name: Run linting
        run: uv run ruff check src/ tests/
        working-directory: packages/kctl-common

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build
        working-directory: packages/kctl-common

      - name: Publish to PyPI
        run: uv publish dist/*
        working-directory: packages/kctl-common
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
