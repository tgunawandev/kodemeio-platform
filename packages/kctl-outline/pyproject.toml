[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kctl-outline"
version = "0.1.0"
description = "Kodemeio Outline CLI — manage Outline wiki instances and sync markdown docs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Kodemeio", email = "dev@kodeme.io" }]
keywords = ["outline", "wiki", "knowledge-base", "cli", "kodemeio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "kctl-lib>=0.4.0",
    "typer>=0.15.0",
    "httpx>=0.28.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
kctl-outline = "kctl_outline.cli:_run"

[tool.uv.sources]
kctl-lib = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/kctl_outline"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
