kind: instance
extends: ../bases/odoo.yaml

instance:
  name: kodemeio-odoo-dist-hr
  description: "Distribution + HRMS — Full distribution ops + HR/payroll on single DB"

dns:
  zone: kodeme.io
  name: odoo-dist-hr
  content: 49.13.14.79             # kodeme-service (16GB RAM)

domain:
  host: odoo-dist-hr.kodeme.io
  port: 8069
  service: odoo
  https: true

database:
  name: odoo_distribution_hrms
  user: odoo

env_overrides:
  PGDATABASE: odoo_distribution_hrms
  PGUSER: odoo
  ODOO_DB_FILTER: "^odoo_distribution_hrms$"
  DOMAIN: odoo-dist-hr.kodeme.io
  ODOO_WORKERS: "6"
  ODOO_MAX_CRON_THREADS: "2"

post_deploy:
  odoo_profile: profile-distribution-hrms
