kind: instance
extends: ../../bases/infra.yaml

instance:
  name: kod-infra-mailcow
  description: "Mailcow mail server"

project: kod

source_overrides:
  repo: kodemeio-mailcow
  branch: "master"

domain:
  host: mail.kodeme.io
  port: 8080
  service: nginx-mailcow
  https: true
  cert: letsencrypt

env_file: ../../env/production/.env.kod-infra-mailcow
