[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kctl-common"
version = "0.3.1"
description = "Shared core library for kctl-* CLI tools"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
testing = ["pytest>=8.3.0"]
monitor = []
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.0",
    "httpx>=0.28.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "pytest-anyio>=0.0.0",
]
