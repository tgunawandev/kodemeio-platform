kind: instance
extends: ../bases/react-pwa.yaml

instance:
  name: kodemeio-react-eam-mac
  description: "MAC Customer — EAM PWA"

project: mandiriagro.com

source_overrides:
  compose_path: ./docker-compose.eam.yml

dns:
  zone: kodeme.io
  name: eam-mac
  content: 49.13.14.79

domain:
  host: eam-mac.kodeme.io
  port: 80
  service: eam
  https: true

env_overrides:
  VITE_EAM_APP_NAME: "MAC EAM"
  VITE_EAM_API_BASE_URL: "https://odoo-mac.kodeme.io"
  VITE_EAM_OIDC_CLIENT_ID: "mac-eam"
  VITE_EAM_OIDC_REDIRECT_URI: "https://eam-mac.kodeme.io/callback"
