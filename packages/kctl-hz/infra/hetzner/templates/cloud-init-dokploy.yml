#cloud-config
# =============================================================================
# Dokploy server cloud-init (App orchestration server)
# =============================================================================

timezone: ${timezone}

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - htop
  - iotop
  - tmux
  - jq
  - unzip
  - fail2ban
  - ufw
  - net-tools
  - ca-certificates
  - gnupg
  - lsb-release
  - apt-transport-https

swap:
  filename: /swapfile
  size: ${swap_size_mb}M
  maxsize: ${swap_size_mb}M

write_files:
  - path: /etc/ssh/sshd_config.d/99-kodemeio.conf
    content: |
      Port ${ssh_port}
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2

  - path: /etc/sysctl.d/99-kodemeio.conf
    content: |
      net.core.somaxconn = 65535
      net.core.netdev_max_backlog = 65536
      net.ipv4.tcp_max_syn_backlog = 65536
      net.ipv4.tcp_tw_reuse = 1
      net.ipv4.ip_local_port_range = 1024 65535
      vm.swappiness = 10
      vm.overcommit_memory = 1
      fs.file-max = 2097152
      fs.inotify.max_user_watches = 524288

  - path: /etc/security/limits.d/99-kodemeio.conf
    content: |
      * soft nofile 65536
      * hard nofile 65536
      * soft nproc 65536
      * hard nproc 65536

  # Docker daemon config
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "100m",
          "max-file": "3"
        },
        "storage-driver": "overlay2",
        "live-restore": true,
        "default-ulimits": {
          "nofile": { "Name": "nofile", "Hard": 65536, "Soft": 65536 }
        }
      }

runcmd:
  - sysctl --system

  # UFW for Dokploy (web + Traefik)
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ${ssh_port}/tcp comment 'SSH'
  - ufw allow 80/tcp comment 'HTTP'
  - ufw allow 443/tcp comment 'HTTPS'
  - ufw allow 3000/tcp comment 'Dokploy UI'
  - ufw --force enable

  # Fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Timezone
  - timedatectl set-timezone ${timezone}

  # Install Docker
  - curl -fsSL https://get.docker.com | sh

  # Install Dokploy
  - curl -sSL https://dokploy.com/install.sh | sh

  # Unattended upgrades
  - apt-get install -y unattended-upgrades
  - dpkg-reconfigure -plow unattended-upgrades

final_message: "Kodemeio Dokploy server ready after $UPTIME seconds"
