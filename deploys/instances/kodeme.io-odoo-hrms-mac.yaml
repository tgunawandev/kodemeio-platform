kind: instance
extends: ../bases/odoo.yaml

instance:
  name: odoo-hrms-mac
  description: "MAC — HRMS (employees, attendance, payroll, leaves, expenses)"

dns:
  zone: kodeme.io
  name: odoo-hrms-mac
  content: 49.13.14.79             # kodeme-service (16GB RAM)

domain:
  host: odoo-hrms-mac.kodeme.io
  port: 8069
  service: odoo-web
  https: true

database:
  name: odoo_hrms_mac
  user: odoo

env_file: ../env/odoo/.env.prod.hrms-mac

env_overrides:
  COMPOSE_PROJECT_NAME: odoo-hrms-mac
  TENANT: mac
  PGDATABASE: odoo_hrms_mac
  PGUSER: odoo
  ODOO_DB_FILTER: "^odoo_hrms_mac$"
  DOMAIN: odoo-hrms-mac.kodeme.io
  ODOO_WORKERS: "2"

post_deploy:
  odoo_profile: profile-hrms
