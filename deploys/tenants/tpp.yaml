tenant:
  code: tpp
  name: "Pakerti"
  short_name: "Pakerti"
  domain: idtpp.com

environments:
  production:
    server: tpp-prod-03
    dns_prefix: ""
    db_prefix: ""
    auto_deploy: false
  staging:
    server: tpp-stg-01
    dns_suffix: "-stg"
    db_suffix: "_stg"
    auto_deploy: true

odoo:
  - recipe: import
    short: erp
    description: "ERP — Import + Trading + Distribution (multi-company, 43 CVs)"
    workers: 4
    apps: [bia, wms]
  - recipe: hrms
    short: hrms
    description: "HRMS (employees, attendance, payroll, leaves, expenses)"
    workers: 2
    apps: [hrm]

web:
  corporate:
    compose_brand: idtpp
  careers: true

accurate_sync:
  enabled: true
  odoo_ref: erp            # maps to the odoo[] entry with short: erp
  tenants: [tpp]           # ACCURATE_TENANTS comma-joined at render
  # server: (defaults to the tpp-odoo-erp server, tpp-prod-03)

schedulers:
  - name: maintenance
    schedule_file: tpp-maintenance.ini
    server: tpp-prod-01

services:
  notify:
    # Pin notify to tpp-prod-01 alongside the rest of the tpp-infra-* stack
    # (postgres, redis, authentik, mailcow, mdm, rmm, outline, zulip, jitsi).
    # Default for tpp tenant apps is tpp-prod-03 (ERP host); this override
    # colocates the notify dispatcher with the postgres + redis it depends on.
    server: tpp-prod-01
  mattermost:
    # DEDICATED HOST — tpp-prod-04 is reserved for Mattermost + RTC. Do NOT
    # colocate other services here. RTC call quality depends on isolated CPU
    # + UDP port availability (8443/8445).
    server: tpp-prod-04

# Hermes — agent on tpp-prod-01, co-located with mm.idtpp.com. Mattermost
# inbound only (Telegram intentionally omitted — that runs on kod-infra-hermes).
# Honcho disabled until Phase C of the 2026-05-23 Honcho rollout.
hermes:
  enabled: true
  edition: business
  server: tpp-prod-01
  inbound:
    telegram:
      enabled: false
    mattermost:
      enabled: true
      url: https://mm.idtpp.com
      reply_mode: thread
      require_mention: true
      allowed_channels:
        - nxe8gt7xyfbp9rxqdqso5m17dr
  memory:
    honcho:
      enabled: false
