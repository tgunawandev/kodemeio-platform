  TENANT: tpp
  PGDATABASE: odoo_hrms_tpp
  PGUSER: odoo
  ODOO_DB_FILTER: "^odoo_hrms_tpp$"
  DOMAIN: odoo-hrms-tpp.kodeme.io
  ODOO_WORKERS: "2"

post_deploy:
  odoo_profile: profile-hrms
