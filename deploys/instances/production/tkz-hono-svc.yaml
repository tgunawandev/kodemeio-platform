kind: instance
extends: ../../bases/infra.yaml

instance:
  name: tkz-hono-svc
  description: "TeraKidz Hono API service (payments, sync, notifications)"

source_overrides:
  repo: terakidz-react
  branch: main
  compose_path: compose/docker-compose.svc.yml

project: tkz
environment: production
server: kod-prod-02

dns:
  zone: terakidz.com
  name: api-svc

domain:
  host: api-svc.terakidz.com
  port: 3100
  service: svc
  https: true
  cert: letsencrypt

healthcheck:
  path: /health
  port: 3100
  expected_status: 200
  timeout: 60
  interval: 10

env_file: ../../env/production/.env.tkz-hono-svc

env_overrides:
  NODE_ENV: production
  PORT: "3100"
  DATABASE_URL: "postgresql://terakidz:${TKZ_PG_PASSWORD}@tkz-postgres:6432/terakidz"
  BETTER_AUTH_SECRET: "${TKZ_AUTH_SECRET}"
  BETTER_AUTH_URL: "https://api-svc.terakidz.com"
