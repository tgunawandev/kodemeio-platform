# =============================================================================
# Kodemeio Authentik Group Structure
# =============================================================================
# Defines the complete group hierarchy for all kodemeio services.
# Sync with: ./scripts/ak-groups.sh sync [--dry-run]
#
# Naming Convention:
#   {prefix}-{tier}-{identifier}[-{sub-identifier}]
#   Prefix:  ak- (Authentik-managed)
#   Tiers:   admin, svc, role, app, dept
# =============================================================================

# =============================================================================
# Admin Groups
# =============================================================================
groups:
  # --- Superuser / Admin ---
  - name: ak-admin-super
    is_superuser: true
    description: Full superuser access to all systems

  - name: ak-admin-app
    is_superuser: false
    description: Application administrators (manage apps, not superuser)

  - name: ak-admin-ldap
    is_superuser: false
    description: LDAP service account administrators

  # =============================================================================
  # Service Account Groups
  # =============================================================================
  - name: ak-svc-ldap
    is_superuser: false
    description: LDAP service accounts (outpost binding)

  - name: ak-svc-api
    is_superuser: false
    description: API service accounts (automation, CI/CD)

  # =============================================================================
  # Role Groups (Application access bundles)
  # =============================================================================
  - name: ak-role-basic
    is_superuser: false
    description: Basic employee access (Mattermost)

  - name: ak-role-office
    is_superuser: false
    description: Office workers (Mattermost + Grafana view)

  - name: ak-role-erp
    is_superuser: false
    description: ERP users (Odoo access)

  - name: ak-role-devops
    is_superuser: false
    description: DevOps tools (Grafana admin, monitoring)

  - name: ak-role-admin
    is_superuser: false
    description: Full access to all applications

  # =============================================================================
  # Application Access Groups
  # =============================================================================

  # --- Mattermost (chat.kodeme.io) ---
  - name: ak-app-mattermost-all
    is_superuser: false
    description: Access to Mattermost chat

  - name: ak-app-mattermost-admin
    is_superuser: false
    description: Mattermost admin access

  # --- Odoo (erp.kodeme.io) ---
  - name: ak-app-odoo-all
    is_superuser: false
    description: Access to Odoo ERP

  - name: ak-app-odoo-admin
    is_superuser: false
    description: Odoo admin access

  # --- Grafana (grafana.kodeme.io) ---
  - name: ak-app-grafana-all
    is_superuser: false
    description: Access to Grafana monitoring

  - name: ak-app-grafana-admin
    is_superuser: false
    description: Grafana admin access

  - name: ak-app-grafana-editor
    is_superuser: false
    description: Grafana editor access

  # --- Plane (plane.kodeme.io) ---
  - name: ak-app-plane-all
    is_superuser: false
    description: Access to Plane project management

  - name: ak-app-plane-admin
    is_superuser: false
    description: Plane admin access

  # --- Zulip (zulip.kodeme.io) ---
  - name: ak-app-zulip-all
    is_superuser: false
    description: Access to Zulip team chat

  - name: ak-app-zulip-admin
    is_superuser: false
    description: Zulip admin access

  # --- Future Services (placeholder) ---
  - name: ak-app-n8n-all
    is_superuser: false
    description: Access to N8N automation

  - name: ak-app-uptime-kuma-all
    is_superuser: false
    description: Access to Uptime Kuma monitoring

  # =============================================================================
  # Department Groups (optional, for RBAC)
  # =============================================================================
  - name: ak-dept-engineering
    is_superuser: false
    description: Engineering department

  - name: ak-dept-operations
    is_superuser: false
    description: Operations department

  - name: ak-dept-management
    is_superuser: false
    description: Management department
