kind: instance
extends: ../bases/react-pwa.yaml

instance:
  name: kodemeio-react-shop-mac
  description: "MAC Customer — SHOP PWA"

project: mandiriagro.com

source_overrides:
  compose_path: ./docker-compose.shop.yml

dns:
  zone: kodeme.io
  name: shop-mac
  content: 49.13.14.79

domain:
  host: shop-mac.kodeme.io
  port: 80
  service: shop
  https: true

env_overrides:
  VITE_SHOP_APP_NAME: "MAC SHOP"
  VITE_SHOP_API_BASE_URL: "https://odoo-mac.kodeme.io"
  VITE_SHOP_OIDC_CLIENT_ID: "mac-shop"
  VITE_SHOP_OIDC_REDIRECT_URI: "https://shop-mac.kodeme.io/callback"
