kind: instance
extends: ../bases/odoo.yaml

instance:
  name: kodemeio-odoo-retail-hr
  description: "Retail + HRMS — Full retail ops + HR/payroll on single DB"

dns:
  zone: kodeme.io
  name: odoo-retail-hr
  content: 49.13.14.79

domain:
  host: odoo-retail-hr.kodeme.io
  port: 8069
  service: odoo
  https: true

database:
  name: odoo_retail_hrms
  user: odoo

env_overrides:
  PGDATABASE: odoo_retail_hrms
  PGUSER: odoo
  ODOO_DB_FILTER: "^odoo_retail_hrms$"
  DOMAIN: odoo-retail-hr.kodeme.io
  ODOO_WORKERS: "6"
  ODOO_MAX_CRON_THREADS: "2"

post_deploy:
  odoo_profile: profile-retail-hrms
