kind: instance
extends: ../bases/nextjs.yaml

instance:
  name: trigunawan-web
  description: "Tri Gunawan portfolio website"

source_overrides:
  compose_path: compose/docker-compose.prod.trigunawan.yml

project: trigunawan.com

dns:
  zone: trigunawan.com
  name: "@"

domain:
  host: trigunawan.com
  port: 4000
  service: trigunawan-web
  https: true
  cert: letsencrypt

env_file: ../env/trigunawan.com-nextjs-web.env
