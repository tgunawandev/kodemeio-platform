kind: instance
extends: ../bases/fastapi.yaml

instance:
  name: api-tms
  description: "Terakidz TMS clinical API (FastAPI)"

source_overrides:
  compose_path: compose/fastapi.prod.api-tms.yml

project: kidneuro-service

dns:
  zone: terakidz.com
  name: api
  # content auto-resolved from server IP

domain:
  host: api.terakidz.com
  port: 8015
  service: api-tms
  https: true
  cert: letsencrypt

healthcheck:
  path: /api/v1/health
  port: 8015
  expected_status: 200
  timeout: 300
  interval: 10

env_overrides:
  APP_ENV: production
  PORT: "8015"
  CORS_ORIGINS: "https://app.terakidz.com,https://home.terakidz.com"
