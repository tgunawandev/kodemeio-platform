# Naming convention for instances:
#   File:     {tenant}-fastapi-{app}.yaml
#   Instance: {tenant}-{app}
#   Domain:   {tenant}-{app}.{domain}  or  api.{domain}
#
# Examples:
#   tkz-fastapi-api-tms   → tkz-api-tms    → api.terakidz.com
#   kod-fastapi-api       → kod-api        → api.kodeme.io

kind: base
type: fastapi

source:
  type: github
  owner: tgunawandev
  repo: kodemeio-odoo
  branch: "18.0"

server: kodeme-service
project: kod

healthcheck:
  path: /api/v1/health
  port: 8000
  expected_status: 200
  timeout: 300
  interval: 10

env_defaults:
  APP_ENV: production
  TZ: "Asia/Jakarta"
  LOG_LEVEL: info
