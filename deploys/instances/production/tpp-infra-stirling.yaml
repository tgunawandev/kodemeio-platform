kind: instance
extends: ../../bases/infra.yaml

instance:
  name: tpp-infra-stirling
  description: "TPP Stirling PDF — self-hosted PDF toolkit (60+ tools, OCR, REST API) gated by Authentik SSO"

project: tpp
environment: production
# Colocated with tpp-infra-authentik on tpp-prod-01 — Stirling uses native
# OAuth2 against Authentik over the public URL (https://auth.idtpp.com), so
# colocation isn't strictly required, but co-host with the rest of the TPP
# infra stack for ops consistency.
server: tpp-prod-01

source_overrides:
  type: github
  owner: tgunawandev
  repo: kodemeio-stirling
  branch: master
  compose_path: ./docker-compose.prod.yml

dns:
  zone: idtpp.com
  name: stirling

domain:
  host: stirling.idtpp.com
  port: 8080
  service: stirling-pdf
  https: true
  cert: letsencrypt

healthcheck:
  path: /api/v1/info/status
  port: 8080
  expected_status: 200
  timeout: 30
  interval: 30

env_file: ../../env/production/.env.tpp-infra-stirling

env_overrides:
  COMPOSE_PROJECT_NAME: tpp-infra-stirling
  TENANT: tpp
  TZ: Asia/Jakarta

# SSO uses Stirling's NATIVE OAuth2 client against Authentik. Authentik-side
# wiring: OAuth2 Provider 'stirling-pdf-oauth2' (confidential) bound to the
# 'Stirling PDF' application on auth.idtpp.com (redirect_uri
# https://stirling.idtpp.com/login/oauth2/code/oidc). No forward-auth, no
# Embedded Outpost binding.
#
# Stirling PDF is stateful (configs, OCR data, pipeline). Volume backups for
# stirling-configs are recommended; the base infra `backup:` block targets
# postgres so it doesn't apply here — handle via volume snapshot or
# `./bin/stirling backup` from the host on a schedule.
