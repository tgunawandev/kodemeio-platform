# =============================================================================
# Odoo Company Setup — CV Mandiri Agro Cemerlang (MAC)
# =============================================================================
# Profile: distribution
# Instance: mac-odoo-dist.mandiriagro.com
# Database: mac_odoo_dist
#
# Usage:
#   This file documents the setup applied. To replay for a new company,
#   copy and modify company/OU/warehouse names, then run with kctl-odoo.
#
# Prerequisites:
#   - Odoo instance deployed with distribution profile
#   - kctl-odoo profile configured: kctl-odoo config add <name> --url <url> --database <db> --api-key admin
# =============================================================================

company:
  name: "CV Mandiri Agro Cemerlang"
  email: "mac@kodeme.io"
  website: "https://mandiriagro.com"
  currency: IDR
  timezone: Asia/Jakarta
  language: id_ID
  base_url: "https://mac-odoo-dist.mandiriagro.com"
  catchall_domain: "mandiriagro.com"

operating_units:
