tenant:
  code: mac
  name: "Mandiri Agro"
  short_name: "MAC"
  domain: mandiriagro.com

environments:
  production:
    server: mac-prod-01
    dns_prefix: ""
    db_prefix: ""
    auto_deploy: false
  staging:
    server: mac-stg-01
    dns_prefix: "stg-"
    db_prefix: "stg_"
    auto_deploy: true

odoo:
  - profile: distribution
    short: dist
    description: "Distribution (SFA, LFA, WMS, DMS, retail, marketplace, BI)"
    workers: 2
    apps: [bia, wms]
  - profile: hrms
    short: hrms
    description: "HRMS (employees, attendance, payroll, leaves, expenses)"
    workers: 2
    apps: [hrm]

web:
  corporate:
    compose_brand: mandiriagro
  careers: true

services:
  notify: true
  redis: true
