tenant:
  code: tpp
  name: "Pakerti"
  short_name: "Pakerti"
  domain: idtpp.com

environments:
  production:
    server: kod-prod-01
    dns_prefix: ""
    db_prefix: ""
    auto_deploy: false
  staging:
    server: kod-prod-02
    dns_prefix: "stg-"
    db_prefix: "stg_"
    auto_deploy: true

odoo:
  - recipe: trading
    short: trad
    description: "Trading (import/export, multi-currency, landed costs)"
    workers: 4
    apps: [sfa, bia, wms]
  - recipe: hrms
    short: hrms
    description: "HRMS (employees, attendance, payroll, leaves, expenses)"
    workers: 2
    apps: [hrm]

web:
  corporate:
    compose_brand: idtpp
  careers: true

services:
  notify:
    # Pin notify to tpp-prod-01 alongside the rest of the tpp-infra-* stack
    # (postgres, redis, alloy, authentik, mailcow, mdm, outline, zulip, jitsi).
    # Default for tpp tenant apps is kod-prod-01; this override colocates the
    # notify dispatcher with the postgres + redis it depends on.
    server: tpp-prod-01
