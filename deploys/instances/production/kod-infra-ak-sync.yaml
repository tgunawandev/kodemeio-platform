kind: instance
extends: ../../bases/infra.yaml
instance:
  name: kod-infra-ak-sync
  description: Automated user provisioning webhook receiver (Odoo HRMS → Authentik → Mailcow → Odoo)
source_overrides:
  type: github
  owner: tgunawandev
  repo: kodemeio-react
  branch: main
  compose_path: apps/api/ak-sync/docker-compose.yml
project: kod
environment: production
server: kod-stg-01
healthcheck:
  path: /health
  port: 3030
  expected_status: 200
  timeout: 60
  interval: 10
dns:
  zone: kodeme.io
  name: ak-sync
domain:
  host: ak-sync.kodeme.io
  port: 3030
  service: ak-sync
  https: true
env_file: ../../env/production/.env.kod-infra-ak-sync
env_overrides:
  NODE_ENV: production
  PORT: '3030'
  TZ: Asia/Jakarta
  PROVISION_CONFIG: ./config/provision-config.yaml
backup:
  enabled: false
