[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kctl-rustdesk"
version = "0.1.0"
description = "Kodemeio RustDesk CLI — manage RustDesk server infrastructure"
requires-python = ">=3.12"
dependencies = [
    "kctl-common>=0.3.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
kctl-rustdesk = "kctl_rustdesk.cli:_run"

[tool.uv.sources]
kctl-common = { workspace = true }

[project.entry-points."kctl_rustdesk.plugins"]

[tool.hatch.build.targets.wheel]
packages = ["src/kctl_rustdesk"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
strict = true
