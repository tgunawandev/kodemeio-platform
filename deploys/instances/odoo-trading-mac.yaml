kind: instance
extends: ../bases/odoo.yaml

instance:
  name: odoo-trading-mac
  description: "MAC — Trading (import/export, multi-currency, landed costs)"

dns:
  zone: kodeme.io
  name: odoo-trading-mac
  content: 49.13.14.79             # kodeme-service (16GB RAM)

domain:
  host: odoo-trading-mac.kodeme.io
  port: 8069
  service: odoo-web
  https: true

database:
  name: odoo_trading_mac
  user: odoo

env_file: ../env/odoo/.env.prod.trading-mac

env_overrides:
  COMPOSE_PROJECT_NAME: odoo-trading-mac
  TENANT: mac
  PGDATABASE: odoo_trading_mac
  PGUSER: odoo
  ODOO_DB_FILTER: "^odoo_trading_mac$"
  DOMAIN: odoo-trading-mac.kodeme.io

post_deploy:
  odoo_profile: profile-trading
