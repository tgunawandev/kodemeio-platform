_min_copier_version: "9.0.0"

project_name:
  type: str
  help: "CLI name (e.g., kctl-myservice)"
  validator: "{% if not project_name.startswith('kctl-') %}Must start with kctl-{% endif %}"

service_key:
  type: str
  help: "Config service key (e.g., myservice)"
  default: "{{ project_name | replace('kctl-', '') }}"

package_name:
  type: str
  help: "Python package name"
  default: "{{ project_name | replace('-', '_') }}"

description:
  type: str
  help: "Short description"
  default: "Kodemeio CLI for {{ service_key }}"

cli_type:
  type: str
  help: "CLI type (monorepo or server)"
  choices:
    - monorepo
    - server
  default: server

env_prefix:
  type: str
  help: "Environment variable prefix"
  default: "{{ project_name | replace('-', '_') | upper }}"
