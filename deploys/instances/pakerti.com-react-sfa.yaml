kind: instance
extends: ../bases/react-pwa.yaml

instance:
  name: pakerti-react-sfa
  description: "Pakerti — SFA PWA"

source_overrides:
  compose_path: compose/docker-compose.sfa.yml

project: pakerti.com

dns:
  zone: pakerti.com
  name: sfa

domain:
  host: sfa.pakerti.com
  port: 80
  service: sfa
  https: true

env_file: ../env/pakerti.com-react-sfa.env

env_overrides:
  VITE_SFA_APP_NAME: "Pakerti SFA"
  VITE_SFA_API_BASE_URL: "https://odoo-trading-tpp.kodeme.io/sfa/api"
  VITE_AUTH_MODE: "native"
  VITE_SFA_OIDC_CLIENT_ID: ""
  VITE_SFA_OIDC_REDIRECT_URI: ""
