name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which E2E suite to run"
        required: true
        type: choice
        options:
          - odoo
          - react
          - all
      smoke_only:
        description: "Run smoke tests only"
        required: false
        type: boolean
        default: true
  schedule:
    # Run smoke tests daily at 06:00 UTC (13:00 WIB)
    - cron: "0 6 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e-odoo:
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.target == 'odoo' ||
      github.event.inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install kctl-odoo
        run: uv sync --all-extras --all-packages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        working-directory: packages/kctl-odoo/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        working-directory: packages/kctl-odoo/e2e
        run: npx playwright test --project=desktop --grep @smoke
        env:
          ODOO_URL: ${{ secrets.E2E_ODOO_URL }}
          ODOO_DATABASE: ${{ secrets.E2E_ODOO_DATABASE }}
          ODOO_API_KEY: ${{ secrets.E2E_ODOO_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-odoo-results
          path: packages/kctl-odoo/e2e/test-results/

  e2e-react:
    if: >
      github.event.inputs.target == 'react' ||
      github.event.inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install kctl-react
        run: uv sync --all-extras --all-packages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: uv run kctl-react e2e test --smoke
        env:
          REACT_APP_URL: ${{ secrets.E2E_REACT_APP_URL }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-react-results
          path: test-results/
