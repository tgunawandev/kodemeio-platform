kind: instance
extends: ../bases/odoo.yaml

instance:
  name: odoo-full-mac
  description: "MAC Customer — Full Odoo ERP (all 13 PWA apps)"

server: kodeme-infra

dns:
  zone: kodeme.io
  name: odoo-full-mac
  content: 49.13.14.79             # kodeme-service (16GB RAM)

domain:
  host: odoo-full-mac.kodeme.io
  port: 8069
  service: odoo-web
  https: true

database:
  name: odoo_full_mac
  user: odoo

env_file: ../env/odoo/.env.prod.mac

env_overrides:
  PGDATABASE: odoo_full_mac
  PGUSER: odoo
  ODOO_DB_FILTER: "^odoo_full_mac$"
  DOMAIN: odoo-full-mac.kodeme.io
  ODOO_WORKERS: "6"
  ODOO_MAX_CRON_THREADS: "2"

post_deploy:
  odoo_profile: profile-full
