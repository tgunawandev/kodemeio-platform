# Local development services for testing kctl-* CLIs
# Usage: docker compose -f docker-compose.dev.yml up -d
#
# This provides local instances of shared infrastructure so CLI commands
# can be tested without connecting to production services.

services:
  postgres:
    image: postgres:16-alpine
    container_name: kodemeio-dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: kodemeio_dev
    ports:
      - "5433:5432"
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kodemeio-dev-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: kodemeio-dev-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: kodemeio-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_dev_data:
  minio_dev_data:

# Dev profile config (~/.config/kodemeio/config.yaml):
#
# profiles:
#   dev:
#     postgres:
#       host: localhost
#       port: 5433
#       user: postgres
#       password: devpassword
#     redis:
#       url: redis://localhost:6380
