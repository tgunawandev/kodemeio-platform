[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kctl-supa"
version = "0.1.0"
description = "Kodemeio Supabase CLI — manage self-hosted Supabase instances"
requires-python = ">=3.12"
dependencies = [
    "kctl-lib>=0.4.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "paramiko>=3.4.0,<4.0.0",
    "sshtunnel>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
kctl-supa = "kctl_supa.cli:_run"

[tool.uv.sources]
kctl-lib = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/kctl_supa"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
strict = true
