tenant:
  code: mac
  name: "Mandiri Agro"
  short_name: "MAC"
  domain: idtpp.com

environments:
  production:
    server: tpp-prod-02
    dns_prefix: ""
    db_prefix: ""
    auto_deploy: false
  staging:
    server: tpp-stg-01
    dns_suffix: "-stg"
    db_suffix: "_stg"
    auto_deploy: true

odoo:
  - recipe: erp
    short: erp
    description: "ERP (accounting, sales, purchase, inventory, BI)"
    workers: 2
    # `erp` is the unified mobile workspace (@kodemeio/erp) that contains
    # bia, eam, lfa, mrp, sfa, wms as runtime-discovered modules.
    apps: [erp]
  - recipe: hrms
    short: hrms
    description: "HRMS (employees, attendance, payroll, leaves, expenses)"
    workers: 2
    apps: [hrm]

web:
  careers: true

services:
  # notify: shared via kod-infra-notify (notify.kodeme.io). MAC origins are
  # registered in env/production/.env.kod-infra-notify ALLOWED_ORIGINS.
  redis: true

# Hermes — agent on tpp-prod-05, co-located with mac-mm.idtpp.com. Mattermost
# inbound only. mac-mm.idtpp.com actually resolves to 178.104.171.122 (tpp-prod-05),
# not tpp-stg-01 as the mac-infra-mattermost.yaml manifest claims. Honcho disabled
# until Phase D of the 2026-05-23 Honcho rollout.
hermes:
  enabled: true
  edition: business
  server: tpp-prod-05
  inbound:
    telegram:
      enabled: false
    mattermost:
      enabled: true
      url: https://mac-mm.idtpp.com
      reply_mode: thread
      require_mention: true
      allowed_channels:
        - bnms3rw37iya5b8g1fdyg3edph
  memory:
    honcho:
      enabled: false
