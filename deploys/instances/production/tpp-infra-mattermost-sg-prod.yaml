kind: instance
extends: ../../bases/infra.yaml

instance:
  name: tpp-infra-mattermost-sg-prod
  description: "TPP Mattermost — PRODUCTION on Singapore (tpp-prod-06). Migration target for mm.idtpp.com. DNS flips at cutover; until then live prod stays on tpp-prod-04."

project: tpp
environment: production
server: tpp-prod-06          # Singapore (ap-southeast), 5.223.69.142

source_overrides:
  owner: tgunawandev
  repo: kodemeio-mattermost
  compose_path: ./docker-compose.prod.yml
  branch: main

dns:
  zone: idtpp.com
  name: mm

domain:
  host: mm.idtpp.com
  port: 8065
  service: mattermost
  https: true
  cert: letsencrypt

env_file: ../../env/production/.env.tpp-infra-mattermost-sg-prod

env_overrides:
  COMPOSE_PROJECT_NAME: tpp-infra-mattermost-sg-prod
  MM_DOMAIN: mm.idtpp.com
  MM_CALLS_PORT: "8466"
  TENANT: tpp
  TZ: Asia/Jakarta

healthcheck:
  path: /api/v4/system/ping
  port: 8065
  expected_status: 200
  timeout: 120
  interval: 30
