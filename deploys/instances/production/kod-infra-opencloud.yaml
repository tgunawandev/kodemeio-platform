kind: instance
extends: ../../bases/infra.yaml

instance:
  name: kod-infra-opencloud
  description: "OpenCloud file management & collaboration platform"

project: kod
server: kod-prod-02

source_overrides:
  repo: kodemeio-opencloud
  compose_path: ./docker-compose.prod.yml

domain:
  host: cloud.kodeme.io
  port: 9200
  service: opencloud
  https: true
  cert: letsencrypt

env_file: ../../env/production/.env.kod-infra-opencloud
