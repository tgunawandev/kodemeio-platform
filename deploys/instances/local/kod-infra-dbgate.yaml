kind: instance
extends: ../../bases/infra.yaml

instance:
  name: kod-infra-dbgate
  description: "DBGate — local mirror (raw compose, published on :3001)"

project: application
environment: local
server: vbox-ubuntu-server

source_overrides:
  type: github
  owner: tgunawandev
  repo: kodemeio-dbgate
  branch: main
  compose_path: ./docker-compose.yml

domain:
  host: localhost
  port: 3001
  service: dbgate
  https: false

env_file: ../../env/local/.env.kod-infra-dbgate
