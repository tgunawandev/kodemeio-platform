# Naming convention for instances:
#   File:     {tenant}-nextjs-{app}.yaml
#   Instance: {tenant}-web
#   Domain:   {domain}  or  {tenant}-{app}.{domain}
#
# Examples:
#   tkz-nextjs-web        → tkz-web            → terakidz.com
#   kod-nextjs-web        → kod-web             → kodeme.io
#   pro-nextjs-web        → pro-web             → provetics.com

kind: base
type: nextjs

source:
  type: github
  owner: tgunawandev
  repo: kodemeio-next
  branch: main

server: kodeme-service
project: kod

healthcheck:
  path: /
  port: 3000
  expected_status: 200
  timeout: 600
  interval: 10

env_defaults:
  NODE_ENV: production
  TZ: "Asia/Jakarta"
