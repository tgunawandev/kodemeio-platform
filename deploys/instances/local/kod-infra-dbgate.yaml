kind: instance
extends: ../../bases/infra.yaml

instance:
  name: kod-infra-dbgate
  description: "DBGate — local via dokploy-traefik (https://dbgate.local.kodeme.io)"

project: application
environment: local
server: vbox-ubuntu-server

source_overrides:
  type: github
  owner: tgunawandev
  repo: kodemeio-dbgate
  branch: main
  compose_path: ./docker-compose.prod.yml

domain:
  host: dbgate.local.kodeme.io
  port: 3000
  service: dbgate
  https: true

env_file: ../../env/local/.env.kod-infra-dbgate
