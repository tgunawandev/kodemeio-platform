# kodemeio-platform/deploys/bases/n8n.yaml
kind: base
type: infrastructure

server: kodeme-service
project: kod

source:
  type: github
  owner: tgunawandev
  repo: kodemeio-n8n-workflow
  branch: main

healthcheck:
  path: /healthz
  port: 5678
  service: n8n
  expected_status: 200
  timeout: 60
  interval: 10

env_defaults:
  TZ: "Asia/Jakarta"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"
  N8N_PROTOCOL: "https"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "168"
  N8N_CONCURRENCY_PRODUCTION_LIMIT: "20"
  N8N_LOG_LEVEL: "info"
  N8N_LOG_OUTPUT: "console"

backup:
  destination: kodemeio-s3-backups
  type: postgres
  schedule: "0 3 * * *"
  prefix_template: "{instance_name}"
  keep_latest: 14
