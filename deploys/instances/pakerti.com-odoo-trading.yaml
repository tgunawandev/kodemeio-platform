kind: instance
extends: ../bases/odoo.yaml

instance:
  name: odoo-trading-tpp
  description: "TPP — Trading (import/export, multi-currency, landed costs)"

project: pakerti.com

dns:
  zone: kodeme.io
  name: odoo-trading-tpp
  content: 49.13.14.79             # kodeme-service (16GB RAM)

domain:
  host: odoo-trading-tpp.kodeme.io
  port: 8069
  service: odoo-web
  https: true

database:
  name: odoo_trading_tpp
  user: odoo

env_file: ../env/pakerti.com-odoo-trading.env

env_overrides:
  COMPOSE_PROJECT_NAME: odoo-trading-tpp
  TENANT: tpp
  PGDATABASE: odoo_trading_tpp
  PGUSER: odoo
  ODOO_DB_FILTER: "^odoo_trading_tpp$"
  DOMAIN: odoo-trading-tpp.kodeme.io

post_deploy:
  odoo_profile: profile-trading
