[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kctl-accurate"
version = "0.1.0a1"
description = "Kodemeio Accurate Online CLI — general-purpose ops on the Accurate API"
requires-python = ">=3.12"
dependencies = [
    "kctl-lib>=0.4.0",
    "kodemeio-accurate>=0.4.0,<1.0.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-httpx>=0.35.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
kctl-accurate = "kctl_accurate.cli:_run"

[project.entry-points."kctl_accurate.plugins"]

[tool.uv.sources]
kctl-lib = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/kctl_accurate"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kctl_lib", "kctl_lib.*", "accurate_sdk", "accurate_sdk.*"]
follow_imports = "silent"
