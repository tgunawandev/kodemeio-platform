[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kctl-gsc"
version = "0.1.0"
description = "Kodemeio Google Search Console CLI — properties, queries, indexing, reports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Kodemeio", email = "dev@kodeme.io" }]
keywords = ["search-console", "seo", "google", "cli", "kodemeio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "kctl-lib>=0.4.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "google-api-python-client>=2.149.0",
    "google-auth>=2.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.0",
    "google-api-python-client-stubs>=1.28.0",
]

[project.scripts]
kctl-gsc = "kctl_gsc.cli:_run"

[tool.uv.sources]
kctl-lib = { workspace = true }

[project.entry-points."kctl_gsc.plugins"]

[tool.hatch.build.targets.wheel]
packages = ["src/kctl_gsc"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a live Google Search Console property",
]
