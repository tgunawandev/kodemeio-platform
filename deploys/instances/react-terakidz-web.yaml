kind: instance
extends: ../bases/nextjs.yaml

instance:
  name: terakidz-web
  description: "Terakidz marketing site (Next.js 15)"

source_overrides:
  compose_path: compose/docker-compose.terakidz.yml

project: kidneuro-service

dns:
  zone: terakidz.com
  name: "@"
  # content auto-resolved from server IP via Gate 1 validation

domain:
  host: terakidz.com
  port: 3000
  service: terakidz-web
  https: true
  cert: letsencrypt
