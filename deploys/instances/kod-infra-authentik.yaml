kind: instance
extends: ../bases/infra.yaml

instance:
  name: kod-authentik
  description: "Authentik SSO/Identity Provider"

source_overrides:
  repo: kodemeio-authentik
  compose_path: ./docker-compose.prod.yml

domain:
  host: auth.kodeme.io
  port: 9000
  service: server
  https: true
  cert: letsencrypt

env_file: ../env/.env.kod-infra-authentik
