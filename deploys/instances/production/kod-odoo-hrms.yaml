kind: instance
extends: ../../bases/odoo.yaml
instance:
  name: kod-odoo-hrms
  description: Kodemeio — HRMS (HR, attendance, leave, payroll)
project: kod
environment: production
server: kod-stg-01
dns:
  zone: kodeme.io
  name: kod-odoo-hrms
domain:
  host: kod-odoo-hrms.kodeme.io
  port: 8069
  service: odoo-web
  https: true
  cert: letsencrypt
database:
  name: odoo_hrms
  user: odoo
env_file: ../../env/production/.env.kod-odoo-hrms
env_overrides:
  COMPOSE_PROJECT_NAME: kod-odoo-hrms
  TENANT: kod
  PGDATABASE: odoo_hrms
  PGUSER: odoo
  PGHOST: '10.0.0.3'
  ODOO_DB_FILTER: ^odoo_hrms$
  DOMAIN: kod-odoo-hrms.kodeme.io
  ODOO_WORKERS: '2'
  ODOO_MAX_CRON_THREADS: '1'
post_deploy:
  odoo_profile: profile-hrms
