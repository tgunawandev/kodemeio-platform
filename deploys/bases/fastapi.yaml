# Naming convention for instances:
#   File:     fastapi-{app}.yaml
#   Instance: {app}
#   Domain:   {app}.kodeme.io  or  api.{domain}.com
#
# Examples:
#   fastapi-api-main      → api-main       → api.kodeme.io
#   fastapi-api-tms       → api-tms        → api.terakidz.com
#   fastapi-ai-main       → ai-main        → ai.kodeme.io

kind: base
type: fastapi

source:
  type: github
  owner: tgunawandev
  repo: kodemeio-odoo
  branch: "18.0"

server: kodeme-service
project: kodeme.io

healthcheck:
  path: /api/v1/health
  port: 8000
  expected_status: 200
  timeout: 300
  interval: 10

env_defaults:
  APP_ENV: production
  TZ: "Asia/Jakarta"
  LOG_LEVEL: info
