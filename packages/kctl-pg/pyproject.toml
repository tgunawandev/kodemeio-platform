[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kctl-pg"
version = "0.2.0"
description = "Kodemeio PostgreSQL CLI — manage PostgreSQL servers via SSH tunnel"
requires-python = ">=3.12"
dependencies = [
    "kctl-common>=0.3.1",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "psycopg[binary]>=3.2.0",
    "sshtunnel>=0.4.0",
    "paramiko>=3.4.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
kctl-pg = "kctl_pg.cli:_run"

[tool.uv.sources]
kctl-common = { workspace = true }

[project.entry-points."kctl_pg.plugins"]

[tool.hatch.build.targets.wheel]
packages = ["src/kctl_pg"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
strict = true
