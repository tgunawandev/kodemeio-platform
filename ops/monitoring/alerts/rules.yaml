# Prometheus Alerting Rules
# Kodemeio Platform
#
# Compatible with Prometheus /etc/prometheus/rules/ or Grafana Alerting provisioning.
# Apply via: kctl-grafana alert list (to verify after import)

groups:
  # -------------------------------------------------------------------------
  # PostgreSQL Alerts
  # -------------------------------------------------------------------------
  - name: postgresql
    interval: 30s
    rules:
      - alert: PostgreSQLConnectionsHigh
        expr: |
          pg_stat_activity_count / on() pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: critical
          service: postgresql
          team: infrastructure
        annotations:
          summary: "PostgreSQL connection count exceeds 80% of max"
          description: |
            PostgreSQL on {{ $labels.instance }} has {{ $value | printf "%.0f" }}% of
            max_connections in use. Current: {{ with query "pg_stat_activity_count" }}{{ . | first | value }}{{ end }},
            Max: {{ with query "pg_settings_max_connections" }}{{ . | first | value }}{{ end }}.
          runbook_url: "https://docs.kodeme.io/runbooks/postgresql-connections"

      - alert: PostgreSQLReplicationLag
        expr: |
          pg_replication_lag_seconds > 30
        for: 5m
        labels:
          severity: warning
          service: postgresql
          team: infrastructure
        annotations:
          summary: "PostgreSQL replication lag exceeds 30 seconds"
          description: |
            Replication lag on {{ $labels.instance }} is {{ $value | printf "%.1f" }}s.

      - alert: PostgreSQLDeadlocks
        expr: |
          rate(pg_stat_database_deadlocks_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: postgresql
          team: infrastructure
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: |
            Database {{ $labels.datname }} on {{ $labels.instance }} is experiencing deadlocks.

  # -------------------------------------------------------------------------
  # Disk Usage Alerts
  # -------------------------------------------------------------------------
  - name: disk
    interval: 60s
    rules:
      - alert: DiskUsageHigh
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 85
        for: 10m
        labels:
          severity: critical
          service: node
          team: infrastructure
        annotations:
          summary: "Disk usage exceeds 85%"
          description: |
            Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is at
            {{ $value | printf "%.1f" }}% capacity. Free space is running low.
          runbook_url: "https://docs.kodeme.io/runbooks/disk-usage"

      - alert: DiskUsageWarning
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 75
        for: 30m
        labels:
          severity: warning
          service: node
          team: infrastructure
        annotations:
          summary: "Disk usage exceeds 75%"
          description: |
            Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is at
            {{ $value | printf "%.1f" }}% capacity. Plan cleanup or expansion.

  # -------------------------------------------------------------------------
  # Service Response Time Alerts
  # -------------------------------------------------------------------------
  - name: response_time
    interval: 30s
    rules:
      - alert: ServiceResponseTimeSlow
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 5
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Service response time (p95) exceeds 5 seconds"
          description: |
            Service {{ $labels.service }} p95 response time is {{ $value | printf "%.2f" }}s
            over the last 10 minutes.

      - alert: ServiceResponseTimeCritical
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 15
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Service response time (p95) exceeds 15 seconds"
          description: |
            Service {{ $labels.service }} p95 response time is {{ $value | printf "%.2f" }}s.
            Immediate investigation required.
          runbook_url: "https://docs.kodeme.io/runbooks/slow-response"

  # -------------------------------------------------------------------------
  # Backup Age Alerts
  # -------------------------------------------------------------------------
  - name: backups
    interval: 300s
    rules:
      - alert: BackupAgeTooOld
        expr: |
          (time() - backup_last_success_timestamp_seconds) / 3600 > 26
        for: 10m
        labels:
          severity: critical
          service: backup
          team: infrastructure
        annotations:
          summary: "Backup age exceeds 26 hours (missed daily backup)"
          description: |
            Last successful backup for {{ $labels.job }} was
            {{ $value | printf "%.1f" }} hours ago. The daily backup schedule
            may have failed. Check backup logs and destination connectivity.
          runbook_url: "https://docs.kodeme.io/runbooks/backup-missed"

      - alert: BackupAgeStaleness
        expr: |
          (time() - backup_last_success_timestamp_seconds) / 3600 > 50
        for: 5m
        labels:
          severity: critical
          service: backup
          team: infrastructure
        annotations:
          summary: "Backup age exceeds 50 hours (2+ missed backups)"
          description: |
            Last successful backup for {{ $labels.job }} was
            {{ $value | printf "%.1f" }} hours ago. Multiple backups have been
            missed. Escalate immediately.

  # -------------------------------------------------------------------------
  # SSL Certificate Expiry
  # -------------------------------------------------------------------------
  - name: ssl
    interval: 3600s
    rules:
      - alert: SSLCertificateExpiringSoon
        expr: |
          (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
          service: ssl
          team: infrastructure
        annotations:
          summary: "SSL certificate expires in less than 14 days"
          description: |
            SSL certificate for {{ $labels.instance }} expires in
            {{ $value | printf "%.0f" }} days. Verify that Let's Encrypt
            auto-renewal via Traefik is functioning.
          runbook_url: "https://docs.kodeme.io/runbooks/ssl-renewal"

      - alert: SSLCertificateExpiryCritical
        expr: |
          (probe_ssl_earliest_cert_expiry - time()) / 86400 < 3
        for: 30m
        labels:
          severity: critical
          service: ssl
          team: infrastructure
        annotations:
          summary: "SSL certificate expires in less than 3 days"
          description: |
            SSL certificate for {{ $labels.instance }} expires in
            {{ $value | printf "%.0f" }} days. Immediate manual renewal required.

  # -------------------------------------------------------------------------
  # Container / Docker Alerts
  # -------------------------------------------------------------------------
  - name: containers
    interval: 60s
    rules:
      - alert: ContainerRestarting
        expr: |
          increase(container_restart_count[1h]) > 3
        for: 5m
        labels:
          severity: warning
          service: docker
          team: platform
        annotations:
          summary: "Container restarting frequently"
          description: |
            Container {{ $labels.name }} has restarted {{ $value | printf "%.0f" }}
            times in the last hour. Check container logs for crash loops.

      - alert: ContainerMemoryHigh
        expr: |
          container_memory_usage_bytes / container_spec_memory_limit_bytes * 100 > 90
        for: 10m
        labels:
          severity: warning
          service: docker
          team: platform
        annotations:
          summary: "Container memory usage exceeds 90% of limit"
          description: |
            Container {{ $labels.name }} is using {{ $value | printf "%.1f" }}%
            of its memory limit.
