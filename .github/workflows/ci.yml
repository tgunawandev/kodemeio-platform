name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Fast gate: lint and test the shared library first.
  # kctl-lib tests depend on workspace-only deps (sshtunnel), so sync workspace-wide.
  kctl-lib:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install workspace dependencies
        run: uv sync --all-extras --all-packages

      - name: Run tests
        run: uv run pytest packages/kctl-lib/tests/ -v --tb=short

      - name: Run linting
        run: uv run ruff check packages/kctl-lib/src/ packages/kctl-lib/tests/

      - name: Check formatting
        run: uv run ruff format --check packages/kctl-lib/src/ packages/kctl-lib/tests/

      - name: No test writes to real user config
        run: bash scripts/check_test_isolation.sh

  # Test all 27 CLI packages (Python 3.12 only — 3.13 covered by kctl-lib job).
  cli-packages:
    needs: kctl-lib
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - kctl-ak
          - kctl-api
          - kctl-cf
          - kctl-claude
          - kctl-claw
          - kctl-dbgate
          - kctl-dokploy
          - kctl-github
          - kctl-glitchtip
          - kctl-grafana
          - kctl-hz
          - kctl-linear
          - kctl-mailcow
          - kctl-mm
          - kctl-notion
          - kctl-odoo
          - kctl-op
          - kctl-opencloud
          - kctl-outline
          - kctl-pg
          - kctl-react
          - kctl-redis
          - kctl-rmm
          - kctl-rustdesk
          - kctl-sentry
          - kctl-telegram
          - kctl-waha
          - kctl-zulip
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace dependencies
        run: uv sync --all-extras --all-packages

      - name: Run tests
        run: uv run pytest packages/${{ matrix.package }}/tests/ -v --tb=short

      - name: Run linting
        run: uv run ruff check packages/${{ matrix.package }}/src/

      - name: Check formatting
        run: uv run ruff format --check packages/${{ matrix.package }}/src/

      # Mypy is tracked but not blocking — 26/27 CLIs still have type debt.
      # Ratchet plan: drop continue-on-error as each package is cleaned up.
      - name: Type check
        run: uv run mypy packages/${{ matrix.package }}/src/
        continue-on-error: true
