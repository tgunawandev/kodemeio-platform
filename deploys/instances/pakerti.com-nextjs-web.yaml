kind: instance
extends: ../bases/nextjs.yaml

instance:
  name: web-tpp
  description: "Pakerti company website"

source_overrides:
  compose_path: compose/docker-compose.pakerti.yml

project: pakerti.com

dns:
  zone: pakerti.com
  name: "@"

domain:
  host: pakerti.com
  port: 3000
  service: pakerti-web
  https: true
  cert: letsencrypt

env_file: ../env/pakerti.com-nextjs-web.env
