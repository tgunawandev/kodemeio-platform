kind: instance
extends: ../bases/react-pwa.yaml

instance:
  name: terakidz-web
  description: "Terakidz marketing site (Next.js)"

source_overrides:
  compose_path: compose/docker-compose.terakidz.yml

project: kidneuro-service

dns:
  zone: terakidz.com
  name: "@"
  # content auto-resolved from server IP via Gate 1 validation

domain:
  host: terakidz.com
  port: 3000
  service: terakidz-web
  https: true
  cert: letsencrypt

healthcheck:
  path: /
  port: 3000
  expected_status: 200
  timeout: 600
  interval: 10

env_overrides:
  NODE_ENV: production
