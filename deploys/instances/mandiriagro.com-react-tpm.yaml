kind: instance
extends: ../bases/react-pwa.yaml

instance:
  name: kodemeio-react-tpm-mac
  description: "MAC Customer — TPM PWA"

project: mandiriagro.com

source_overrides:
  compose_path: ./docker-compose.tpm.yml

dns:
  zone: kodeme.io
  name: tpm-mac
  content: 49.13.14.79

domain:
  host: tpm-mac.kodeme.io
  port: 80
  service: tpm
  https: true

env_overrides:
  VITE_TPM_APP_NAME: "MAC TPM"
  VITE_TPM_API_BASE_URL: "https://odoo-mac.kodeme.io"
  VITE_TPM_OIDC_CLIENT_ID: "mac-tpm"
  VITE_TPM_OIDC_REDIRECT_URI: "https://tpm-mac.kodeme.io/callback"
